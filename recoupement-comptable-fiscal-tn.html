<!DOCTYPE html>
<html lang="fr" data-mode="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recoupement comptable et fiscal — Tunisie</title>
<style>
:root{
  --bg:#f4f2ec;--card:#ffffff;--ink:#1c2a33;--mute:#667781;--line:#ded9cc;--field:#fbfaf6;
  --brand:#0e4a5a;--on-brand:#ffffff;--accent:#c58a1b;
  --ok:#1d7a4c;--okbg:#e3f3ea;--warn:#9a5700;--warnbg:#fdf0d9;--bad:#b3261e;--badbg:#fbe4e1;
  --radius:10px;--shadow:0 1px 2px rgba(20,40,50,.06),0 4px 14px rgba(20,40,50,.05);
}
html[data-mode=dark]{--bg:#10181d;--card:#172229;--ink:#e6ecef;--mute:#92a3ac;--line:#2a3a43;--field:#122027;
  --ok:#5fd39a;--okbg:#14352a;--warn:#f0b35a;--warnbg:#3a2c12;--bad:#ff8a80;--badbg:#3c1b19;--shadow:none}
@media (prefers-color-scheme:dark){
  html[data-mode=auto]{--bg:#10181d;--card:#172229;--ink:#e6ecef;--mute:#92a3ac;--line:#2a3a43;--field:#122027;
    --ok:#5fd39a;--okbg:#14352a;--warn:#f0b35a;--warnbg:#3a2c12;--bad:#ff8a80;--badbg:#3c1b19;--shadow:none}
}
:root{--hdr:#0b3744;--hdr2:#145c6e}
html[data-mode=dark] body,html[data-mode=dark]{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px}
button:hover{border-color:var(--brand)}
button.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand);font-weight:600}
button.x{padding:2px 8px;color:var(--bad);border-color:transparent;background:transparent;font-size:18px;line-height:1}
input,select{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}

/* verrouillage */
#lock{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,var(--hdr) 0%,var(--hdr2) 100%)}
.lockcard{width:min(420px,100%);background:var(--card);border-radius:14px;padding:32px 28px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.lockcard .mark{width:46px;height:46px;border-radius:12px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-size:22px;margin-bottom:14px}
.lockcard h1{font-size:20px;margin:0 0 4px}
.lockcard p{margin:0 0 18px;color:var(--mute)}
.lockcard input{width:100%;padding:11px 12px;font-size:16px;letter-spacing:.12em}
.lockcard button{width:100%;margin-top:12px;padding:11px}
#lockMsg{min-height:20px;margin-top:10px;color:var(--bad);font-size:13px}

/* en-tête */
header.top{background:var(--hdr);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
header.top h1{margin:0;font-size:17px;font-weight:650;letter-spacing:.01em}
header.top h1 small{display:block;font-weight:400;opacity:.7;font-size:12px}
header.top .ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header.top input,header.top select{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
header.top select option{color:#111}
header.top input::placeholder{color:rgba(255,255,255,.6)}
header.top button{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
header.top button:hover{background:rgba(255,255,255,.2)}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:10px 20px;border-bottom:1px solid var(--line)}
av.tabs button{white-space:nowrap;border-radius:999px;padding:7px 16px}
av.tabs button[aria-selected=true]{background:var(--brand);color:var(--on-brand);border-color:var(--brand);font-weight:600}
main{max-width:1240px;margin:0 auto;padding:18px 20px 60px}
.panel>.intro{color:var(--mute);margin:0 0 14px;max-width:80ch}

/* cartes */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h3{margin:0 0 4px;font-size:15px}
.card h4{margin:16px 0 6px;font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between;align-items:center}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.hint{color:var(--mute);font-size:12.5px;margin:2px 0 10px}
.note{font-size:13px;color:var(--mute)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;align-items:start}
.cols>.card{margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi span{display:block;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.kpi b{font-size:26px;font-weight:650}
.kpi.ok b{color:var(--ok)}.kpi.warn b{color:var(--warn)}.kpi.bad b{color:var(--bad)}

/* tableaux */
.scroll{overflow-x:auto}
table.grid{border-collapse:collapse;width:100%;min-width:640px}
.grid th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);text-align:right;padding:8px 8px;border-bottom:2px solid var(--line);white-space:nowrap;font-weight:600}
.grid th:first-child,.grid td:first-child{text-align:left}
.grid td{padding:3px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.grid td.m{padding:3px 8px;color:var(--mute)}
.grid td.r{text-align:right;padding:3px 8px;white-space:nowrap}
.grid input{width:100%;border-color:transparent;background:transparent;text-align:right}
.grid input:hover{border-color:var(--line)}
.grid input:focus{background:var(--field)}
.grid input.txt,.grid select{text-align:left}
.grid input.plain{width:64px}
.grid tfoot td{font-weight:650;border-top:2px solid var(--line);border-bottom:none;padding:7px 8px}
.grid tfoot td.r{padding:7px 8px}
.grid td[data-s=bad]{color:var(--bad);font-weight:650}
.grid td[data-s=warn]{color:var(--warn);font-weight:600}
.b{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.b.ok{background:var(--okbg);color:var(--ok)}
.b.warn{background:var(--warnbg);color:var(--warn)}
.b.bad{background:var(--badbg);color:var(--bad)}
.b.na{color:var(--mute)}
.grid td.stc{text-align:right;padding:3px 8px}
.grid th.stc{text-align:right}

/* lignes clé/valeur */
.kv{display:grid;grid-template-columns:1fr minmax(130px,190px);gap:10px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line)}
.kv label,.kv>span{color:var(--ink)}
.kv input,.kv select{width:100%;text-align:right}
.kv select{text-align:left}
.kv b,.kv .o{text-align:right;font-weight:600}
.kv.total{border-bottom:2px solid var(--line);font-weight:650;margin-top:4px}
.kv small{grid-column:1/-1;color:var(--mute);font-size:12px;margin-top:-4px}
.kv.chk{grid-template-columns:20px 1fr}
.kv.chk input{width:auto}
.lrow{display:grid;grid-template-columns:1fr 150px 30px;gap:6px;margin-bottom:5px}
.lrow input.num{text-align:right}
.alerts{margin:0;padding-left:18px}
.alerts li{margin:6px 0}
.alerts li.bad::marker{color:var(--bad)}.alerts li.warn::marker{color:var(--warn)}
.alerts li.good{list-style:none;margin-left:-18px;color:var(--ok)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pgrid label{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
.pgrid input{width:100%}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px}

#societe{min-width:230px}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.duo>.card{margin:0;min-width:0}
.duo .grid{min-width:600px}
.duo .grid th{white-space:normal;font-size:11px;padding:6px 4px}
.duo .grid td.r,.duo .grid td.m{padding-left:4px;padding-right:4px}
.duo .grid td.stc{padding:3px 4px}
.duo .b{font-size:10.5px;padding:2px 6px}
@media (max-width:1100px){.duo{grid-template-columns:1fr}}
.fhint{background:var(--field);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:8px;padding:9px 12px;margin:0 0 14px;font-size:13px;color:var(--mute);max-width:110ch}
.fhint b{color:var(--ink)}
.fhint code,.fhint kbd{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:0 5px;font:12.5px/1.5 ui-monospace,Consolas,monospace;color:var(--ink)}
input.hasf{border-bottom:2px dotted var(--brand)!important;font-style:italic}
input.err{outline:2px solid var(--bad);color:var(--bad)}
.sec{font-size:15px;margin:24px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--brand);color:var(--brand)}
.panel>.sec:first-of-type{margin-top:6px}
.lrow2{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line)}
.tw{position:relative}
.themebox{position:absolute;right:0;top:calc(100% + 8px);width:250px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 12px 32px rgba(0,0,0,.28);z-index:30}
.themebox .thl{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:0 0 8px}
.themebox .sws{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
header.top .themebox .sw{width:30px;height:30px;border-radius:50%;padding:0;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
header.top .themebox .sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}
.themebox .modes{display:flex;gap:6px}
header.top .themebox button{background:var(--card);color:var(--ink);border-color:var(--line)}
header.top .themebox .modes button{flex:1;padding:6px 4px}
header.top .themebox .modes button[aria-pressed=true]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
@media (max-width:640px){
  header.top{padding:12px 14px}main{padding:14px 12px 50px}nav.tabs{padding:8px 12px}
  .cols{grid-template-columns:1fr}.kv{grid-template-columns:1fr 130px}
}
@media print{
  #lock,header.top .ctl,nav.tabs,button,.cardhead div:last-child{display:none!important}
  body{background:#fff;color:#000}
  .card,.kpi{box-shadow:none;break-inside:avoid;border-color:#bbb}
  input,select{border:none!important;background:transparent!important;color:#000!important;appearance:none}
  header.top{background:#fff;color:#000;border-bottom:2px solid #000;padding:0 0 8px}
  .printall .panel{display:block!important}
}
</style>
</head>
<body>

<div id="lock">
  <form class="lockcard" id="lockForm" autocomplete="off">
    <div class="mark" aria-hidden="true">⚖</div>
    <h1>Recoupement comptable et fiscal</h1>
    <p>Accès protégé. Saisissez le mot de passe pour ouvrir l’application.</p>
    <input type="password" id="pwd" placeholder="Mot de passe" aria-label="Mot de passe" autofocus>
    <button class="primary" type="submit">Déverrouiller</button>
    <div id="lockMsg" role="alert"></div>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <h1>Recoupement comptable et fiscal<small>Tunisie · PCG / CGI · montants en dinars (DT)</small></h1>
    <div class="ctl">
      <select id="societe" aria-label="Société"></select>
      <button data-act="addSoc" title="Ajouter une société">+ Société</button>
      <select id="exercice" aria-label="Exercice"></select>
      <button data-act="addEx" title="Ajouter un exercice">+ Exercice</button>
      <button data-act="export" title="Sauvegarder ce dossier en fichier">Exporter</button>
      <button data-act="import" title="Charger un dossier sauvegardé">Importer</button>
      <button data-act="print">Imprimer</button>
      <span class="tw"><button data-act="theme" title="Changer la couleur de l’application">🎨 Couleur</button><div id="themeBox" class="themebox" hidden></div></span>
      <button data-act="lock">🔒 Verrouiller</button>
      <input type="file" id="file" accept="application/json" hidden>
    </div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="panels"></main>
</div>

<script>
(function(){
'use strict';

/* ================= Accès ================= */
const SALT='RCF-TN|';
const H_SHA='ebd4040b13601074db6f6c3123a854133e8c0507b0746c6b220a26330b1094ee';
const H_FAST='2817454156479759';
function cyrb53(str,seed){seed=seed||0;let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);}
async function checkPwd(p){
  const s=SALT+p;
  try{
    if(window.crypto&&window.crypto.subtle){
      const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('')===H_SHA;
    }
  }catch(e){}
  return String(cyrb53(s))===H_FAST;
}

/* ================= Utilitaires ================= */
const $=(s,r)=>(r||document).querySelector(s);
const MONTHS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const PLAIN=/^[+-]?(d+\.?d*|\.\d+)$/;
function norm(v){
  let s=String(v).replace(/[\s]/g,'').replace(/−/g,'-').replace(/[×xX·]/g,'*').replace(/[÷:]/g,'/');
  if(s.charAt(0)==='=')s=s.slice(1);
  if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(/,/g,'.');
  return s;
}
/* évaluateur arithmétique sûr (pas d'eval) : + - * / ( ) et % */
function evalExpr(s){
  let i=0;
  function expr(){let v=term();while(i<s.length&&(s[i]==='+'||s[i]==='-')){const o=s[i++];const r=term();v=o==='+'?v+r:v-r;}return v;}
  function term(){let v=unary();while(i<s.length&&(s[i]==='*'||s[i]==='/')){const o=s[i++];const r=unary();v=o==='*'?v*r:v/r;}return v;}
  function unary(){if(s[i]==='-'){i++;return -unary();}if(s[i]==='+'){i++;return unary();}return post();}
  function post(){let v=atom();while(s[i]==='%'){i++;v=v/100;}return v;}
  function atom(){
    if(s[i]==='('){i++;const v=expr();if(s[i]!==')')throw 0;i++;return v;}
    const m=/^(\d+\.?\d*|\.\d+)/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0]);
  }
  try{const v=expr();return(i===s.length&&isFinite(v))?v:null;}catch(e){return null;}
}
function num(v){
  if(v===''||v==null)return null; if(typeof v==='number')return isFinite(v)?v:null;
  const s=norm(v);if(s==='')return null;
  if(PLAIN.test(s))return parseFloat(s);
  return evalExpr(s);
}
function isFormula(v){if(typeof v!=='string')return false;const s=norm(v);return s!==''&&!PLAIN.test(s)&&evalExpr(s)!==null;}
const z=v=>num(v)||0;
const nf=new Intl.NumberFormat('fr-FR',{minimumFractionDigits:3,maximumFractionDigits:3});
const fmt=n=>n==null?'':nf.format(Math.round(n*1000)/1000);
const fmtS=n=>n==null?'':((n>0.0005?'+':'')+fmt(n));
const fmtIn=v=>{const n=num(v);return n==null?'':nf.format(n);};
const pv=v=>v==null?'':String(v).replace('.',',');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arr=()=>Array(12).fill('');
const sum=a=>a.reduce((t,v)=>t+z(v),0);

/* ================= Paramètres ================= */
const DEF_PARAMS={
  tol:1, tvaLow:7, tvaHigh:19, rateTol:0.5,
  cnss:{pat:16.57,at:0.5,sal:9.18}, tfp:1, foprolos:1,
  is:{minRate:0.2,minFloor:300},
  rsNat:[
    {n:'Marchés (1,5 %)',t:1.5,seuil:1000},
    {n:'Honoraires (15 %)',t:15,seuil:0},
    {n:'Honoraires – régime réel (10 %)',t:10,seuil:0},
    {n:'Loyers (15 %)',t:15,seuil:0},
    {n:'Commissions / courtage (15 %)',t:15,seuil:0},
    {n:'Commissions – régime réel (10 %)',t:10,seuil:0},
    {n:'RS sur TVA (25 % de la TVA)',t:25,seuil:1000},
    {n:'Autre (taux libre)',t:0,seuil:0}
  ],
  irpp:{
    bareme:[[5000,0],[10000,15],[20000,25],[30000,30],[40000,33],[50000,36],[70000,38],[null,40]],
    fraisPro:10,fraisProMax:2000,chefFamille:300,enfant:100,enfantMax:4,css:0.5
  }
};
const REG={
  '20':{l:'Taux normal 20 %',t:20,css:3,min:400},
  '10':{l:'Taux réduit 10 %',t:10,css:3,min:200},
  '35':{l:'Taux majoré 35 %',t:35,css:4,min:500},
  '40':{l:'Taux majoré 40 %',t:40,css:4,min:500},
  '0':{l:'Exonérée / déduction totale',t:0,css:0,min:400}
};
let P=JSON.parse(JSON.stringify(DEF_PARAMS));

/* ================= Données du dossier ================= */
function blank(){return{
  tva:{ca7_c:arr(),ca7_d:arr(),ca19_c:arr(),ca19_d:arr(),exp_c:arr(),exp_d:arr(),susp_c:arr(),susp_d:arr(),exo_c:arr(),exo_d:arr(),quai_c:arr(),quai_d:arr(),col7_c:arr(),col7_d:arr(),col19_c:arr(),col19_d:arr(),dedI_c:arr(),dedI_d:arr(),dedL_c:arr(),dedL_d:arr()},
  rs:[],
  paie:{brut_c:arr(),ass_d:arr(),pat_c:arr(),pat_d:arr(),sal_c:arr(),sal_d:arr(),irpp_c:arr(),irpp_d:arr(),tfp_c:arr(),tfp_d:arr(),fop_c:arr(),fop_d:arr()},
  is:{rc:'',reint:[{lib:'',mt:''}],deduc:[{lib:'',mt:''}],deficit:'',regime:'20',css:true,c4:false,ca:'',is_c:'',cs_c:'',is_n1:'',ac1:'',ac2:'',ac3:'',rsub:''},
  sim:{brut:'',chef:true,enf:'0'}
};}
function merge(d,s){
  if(Array.isArray(d))return Array.isArray(s)?s:d;
  if(d&&typeof d==='object'){const o=Object.assign({},d);if(s&&typeof s==='object')for(const k in s)o[k]=(k in d)?merge(d[k],s[k]):s[k];return o;}
  return s===undefined?d:s;
}
let state=blank();
const lists={
  societes:['PROMOSCIENCES','NORAFRIMED','TUNLYB TEKLAB','TECHNOLABO','NORAFRILABS','LSTE','LIFE SCIENCES AND TESTING EQUIPMENT','TECHNOLABO INTERNATIONALE'],
  exercices:[2024,2025,2026,2027,2028,2029,2030]
};
let meta={societe:'',exercice:new Date().getFullYear()};
let activeTab='syn';
const RES={};

function dkey(){return 'rcf:d:'+(meta.societe||'').trim().toUpperCase()+':'+meta.exercice;}
function ls(fn){try{return fn();}catch(e){return null;}}
function saveAll(){
  ls(()=>{localStorage.setItem(dkey(),JSON.stringify(state));localStorage.setItem('rcf:meta',JSON.stringify(meta));localStorage.setItem('rcf:params',JSON.stringify(P));localStorage.setItem('rcf:lists',JSON.stringify(lists));});
}
function ensureLists(){
  if(!meta.societe)meta.societe=lists.societes[0];
  else{
    const f=lists.societes.find(s=>s.toUpperCase()===String(meta.societe).toUpperCase());
    if(f)meta.societe=f;else{meta.societe=String(meta.societe).trim().toUpperCase();lists.societes.push(meta.societe);}
  }
  meta.exercice=+meta.exercice;
  if(lists.exercices.indexOf(meta.exercice)<0){lists.exercices.push(meta.exercice);}
  lists.exercices.sort((a,b)=>a-b);
}
function loadAll(){
  const m=ls(()=>JSON.parse(localStorage.getItem('rcf:meta')||'null'));if(m)meta=Object.assign(meta,m);
  const p=ls(()=>JSON.parse(localStorage.getItem('rcf:params')||'null'));if(p)P=merge(DEF_PARAMS,p);
  const l=ls(()=>JSON.parse(localStorage.getItem('rcf:lists')||'null'));

/* ================= Statuts ================= */
const LAB={ok:'Conforme',warn:'À justifier',bad:'Écart significatif',na:'—'};
const RANK={na:0,ok:1,warn:2,bad:3};
function st(e,base){
  if(e==null)return 'na';
  const a=Math.abs(e);
  if(a<=P.tol)return 'ok';
  if(a>Math.max(1000,0.05*Math.abs(base||0)))return 'bad';
  return 'warn';
}
const worst=(...s)=>s.reduce((m,x)=>RANK[x]>RANK[m]?x:m,'na');
const badge=s=>'<span class="b '+s+'">'+LAB[s]+'</span>'; 

/* ================= Calculs ================= */
function arrOf(spec){
  if(typeof spec==='string')return getP(spec);
  return Array.from({length:12},(_,i)=>{let any=false,t=0;spec.forEach(p=>{const n=num(getP(p)[i]);if(n!=null){any=true;t+=n;}});return any?t:null;});
}
function computeGroup(g){
  const A=arrOf(g.sumA||g.a),B=arrOf(g.sumB||g.b);
  const RN=g.ratio?arrOf(g.ratio.n):null,RD=g.ratio?arrOf(g.ratio.d):null;
  const rows=[];let ta=0,tb=0,tth=0,tbth=0,anyA=false,anyB=false,anyT=false;
  for(let i=0;i<12;i++){
    const a=num(A[i]),b=num(B[i]);
    const th=g.th?g.th(i):null;
    const e=(a==null&&b==null)?null:(a||0)-(b||0);
    const eth=(th==null||b==null)?null:th-b;
    let r=null,rf=false;
    if(g.ratio){const nn=num(RN[i]),dd=num(RD[i]);if(dd&&nn!=null){r=nn/dd*100;rf=r<P[g.ratio.min]-P.rateTol||r>P[g.ratio.max]+P.rateTol;}}
    const s=worst(st(e,Math.max(Math.abs(a||0),Math.abs(b||0))),st(eth,Math.abs(b||0)));
    rows.push({a,b,th,e,eth,r,rf,s});
    if(a!=null){ta+=a;anyA=true;} if(b!=null){tb+=b;anyB=true;}
    if(th!=null&&b!=null){tth+=th;tbth+=b;anyT=true;}
  }
  const tot={a:anyA?ta:null,b:anyB?tb:null,e:(anyA||anyB)?ta-tb:null,th:anyT?tth:null,eth:anyT?tth-tbth:null};
  tot.s=worst(st(tot.e,Math.max(Math.abs(ta),Math.abs(tb))),st(tot.eth,Math.abs(tbth)),...rows.map(r=>r.s));
  if(g.ratio){let n=0,d=0;RN.forEach(v=>n+=z(v));RD.forEach(v=>d+=z(v));if(d){tot.r=n/d*100;tot.rf=tot.r<P[g.ratio.min]-P.rateTol||tot.r>P[g.ratio.max]+P.rateTol;}}
  return{rows,tot};
}
function put(id,txt,s){const el=document.getElementById(id);if(!el)return;el.textContent=txt;if(s!==undefined)el.dataset.s=s;}

}

function computeRS(){
  const T={th:0,c:0,d:0};let anyC=false,anyD=false,anyT=false;const sts=[];const bad=[];
  state.rs.forEach((r,i)=>{
    const nat=P.rsNat[r.nature]||P.rsNat[P.rsNat.length-1];
    const as=num(r.assiette),tx=num(r.taux)||0,c=num(r.compta),d=num(r.decl);
    const th=as==null?null:((nat.seuil&&as<nat.seuil)?0:as*tx/100);
    const e1=th==null?null:(c||0)-th;
    const e2=(c==null&&d==null)?null:(c||0)-(d||0);
    const s=worst(st(e1,Math.abs(th||0)),st(e2,Math.max(Math.abs(c||0),Math.abs(d||0))));
    sts.push(s);
    put('o-rs-th-'+i,fmt(th));put('o-rs-e1-'+i,fmtS(e1),st(e1,Math.abs(th||0)));put('o-rs-e2-'+i,fmtS(e2),st(e2,Math.max(Math.abs(c||0),Math.abs(d||0))));putH('o-rs-s-'+i,s==='na'?'':badge(s));
    if(th!=null){T.th+=th;anyT=true;} if(c!=null){T.c+=c;anyC=true;} if(d!=null){T.d+=d;anyD=true;}
    if(s==='warn'||s==='bad')bad.push((r.tiers||('ligne '+(i+1)))+' ('+(MONTHS[+r.mois||0]||'mois').toLowerCase()+')');
  });
  const e1=anyT?T.c-T.th:null,e2=(anyC||anyD)?T.c-T.d:null;
  RES.rs={th:anyT?T.th:null,c:anyC?T.c:null,d:anyD?T.d:null,e1,e2,bad,n:state.rs.length,s1:state.rs.length&&anyT?worst(st(e1,Math.abs(T.th)),...sts):'na',s2:(anyC||anyD)?st(e2,Math.max(Math.abs(T.c),Math.abs(T.d))):'na'};
  put('o-rs-T-th',fmt(RES.rs.th));put('o-rs-T-c',fmt(RES.rs.c));put('o-rs-T-d',fmt(RES.rs.d));put('o-rs-T-e1',fmtS(e1),RES.rs.s1);put('o-rs-T-e2',fmtS(e2),RES.rs.s2);
}

function computeIS(){
  const s=state.is,rc=num(s.rc),reint=s.reint.reduce((t,r)=>t+z(r.mt),0),deduc=s.deduc.reduce((t,r)=>t+z(r.mt),0);
  const rf=z(s.rc)+reint-deduc,base=Math.max(0,rf-z(s.deficit)),rg=REG[s.regime]||REG['20'];
  const caTva=sum(arrOf(['tva.ca7_c','tva.ca19_c','tva.exp_c','tva.susp_c','tva.exo_c','tva.quai_c'])),ca=num(s.ca)!=null?num(s.ca):caTva;
  const isTh=base*rg.t/100,minI=s.regime==='0'?0:Math.max(ca*P.is.minRate/100,P.is.minFloor),du=Math.max(isTh,minI);
  const css=s.css?Math.max(base*rg.css/100,rg.min):0,c4=s.c4?Math.max(base*0.04,10000):0,total=du+css+c4;
  const acExp=0.3*z(s.is_n1),acV=z(s.ac1)+z(s.ac2)+z(s.ac3),solde=total-acV-z(s.rsub),net=rc==null?null:z(s.rc)-z(s.is_c);
  put('o-is-reint',fmt(reint));put('o-is-deduc',fmt(deduc));put('o-is-rf',fmt(rf));put('o-is-base',fmt(base));put('o-is-th',fmt(isTh));put('o-is-ca',fmt(ca));put('o-is-min',fmt(minI));put('o-is-du',fmt(du));put('o-is-which',s.regime==='0'?'Régime exonéré':(minI>isTh?'Minimum d’impôt retenu':'IS au taux retenu'));put('o-is-css',fmt(css));put('o-is-c4',fmt(c4));put('o-is-tot',fmt(total));put('o-is-acexp',fmt(acExp*3));put('o-is-acv',fmt(acV));put('o-is-solde',fmtS(solde)+(solde>0.0005?'  (à payer)':solde<-0.0005?'  (excédent)':''));put('o-is-net',net==null?'':fmt(net));put('o-is-tx',rc?((du/z(s.rc))*100).toFixed(1).replace('.',',')+' %':'');
  const hasIC=num(s.is_c)!=null,hasCS=num(s.cs_c)!=null,e1=hasIC?z(s.is_c)-du:null,e2=hasCS?z(s.cs_c)-(css+c4):null,e3=(num(s.is_n1)!=null&&(num(s.ac1)!=null||num(s.ac2)!=null||num(s.ac3)!=null))?acV-acExp*3:null,e4=num(s.ca)!=null&&caTva?num(s.ca)-caTva:null;
  const R={is:{e:e1,s:st(e1,du),A:hasIC?z(s.is_c):null,B:du},cs:{e:e2,s:st(e2,css+c4),A:hasCS?z(s.cs_c):null,B:css+c4},ac:{e:e3,s:st(e3,acExp*3),A:e3==null?null:acV,B:acExp*3},ca:{e:e4,s:st(e4,caTva),A:num(s.ca),B:caTva}};
  Object.assign(RES,{isr:R,is:{du,css,c4,base,rf}};
  [['is','e1'],['cs','e2'],['ac','e3'],['ca','e4']].forEach(([k,id])=>{put('o-is-'+id,fmtS(R[k].e),R[k].s);putH('o-is-'+id+'s',R[k].s==='na'?'':badge(R[k].s));});
}

function buildChecks(){
  const C=[];
  GROUPS.forEach(g=>{const r=RES[g.id];if(!r)return;C.push({mod:g.mod,name:g.t+' : comptabilité ↔ déclaré',A:r.tot.a,B:r.tot.b,e:r.tot.e,s:r.tot.s,months:r.rows.map((x,i)=>(x.s==='warn'||x.s==='bad')?MONTHS[i]:null).filter(Boolean)});if(g.th&&r.tot.th!=null)C.push({mod:g.mod,name:g.t+' : théorique ↔ déclaré',A:r.tot.th,B:r.tot.b,e:r.tot.eth,s:worst(st(r.tot.eth,Math.abs(r.tot.b||0)),...r.rows.map(x=>x.eth==null?'na':st(x.eth,Math.abs(x.b||0)))),months:r.rows.map((x,i)=>(x.eth!=null&&st(x.eth,Math.abs(x.b||0))!=='ok')?MONTHS[i]:null).filter(Boolean)});});
  const colC=arrOf(['tva.col7_c','tva.col19_c']),dedC=arrOf(['tva.dedI_c','tva.dedL_c']),colD=arrOf(['tva.col7_d','tva.col19_d']),dedD=arrOf(['tva.dedI_d','tva.dedL_d']),nc=sum(colC)-sum(dedC),nd=sum(colD)-sum(dedD);
  if([colC,dedC,colD,dedD].some(a=>a.some(v=>v!=null)))C.push({mod:'TVA',name:'TVA nette (collectée − déductible) : comptabilité ↔ déclaré',A:nc,B:nd,e:nc-nd,s:st(nc-nd,Math.max(Math.abs(nc),Math.abs(nd))),months:[]});
  const r=RES.rs;if(r&&r.n){if(r.th!=null)C.push({mod:'Retenues',name:'Retenues à la source : théorique ↔ comptabilisé',A:r.c,B:r.th,e:r.e1,s:r.s1,months:r.bad});if(r.c!=null||r.d!=null)C.push({mod:'Retenues',name:'Retenues à la source : comptabilisé ↔ déclaré',A:r.c,B:r.d,e:r.e2,s:r.s2,months:[]});}
  const R=RES.isr;if(R){if(R.is.s!=='na')C.push({mod:'IS',name:'Charge d’IS comptabilisée ↔ IS dû',A:R.is.A,B:R.is.B,e:R.is.e,s:R.is.s,months:[]});if(R.cs.s!=='na')C.push({mod:'IS',name:'CSS / contributions comptabilisées ↔ calculées',A:R.cs.A,B:R.cs.B,e:R.cs.e,s:R.cs.s,months:[]});if(R.ac.s!=='na')C.push({mod:'IS',name:'Acomptes versés ↔ attendus',A:R.ac.A,B:R.ac.B,e:R.ac.e,s:R.ac.s,months:[]});if(R.ca.s!=='na')C.push({mod:'IS',name:'CA retenu pour le minimum d’impôt ↔ CA HT comptable',A:R.ca.A,B:R.ca.B,e:R.ca.e,s:R.ca.s,months:[]});}
  return C;
}

  let h='<thead><tr><th>Domaine</th><th>Contrôle</th><th>Valeur A</th><th>Valeur B</th><th>Écart (A − B)</th><th class="stc">Statut</th></tr></thead><tbody>';
  if(!CHECKS.length)h+='<tr><td colspan="6" class="m">Aucune donnée saisie.</td></tr>';CHECKS.forEach(c=>{h+='<tr><td class="m">'+c.mod+'</td><td style="padding:6px 8px">'+esc(c.name)+'</td><td class="r">'+fmt(c.A)+'</td><td class="r">'+fmt(c.B)+'</td><td class="r" data-s="'+c.s+'">'+fmtS(c.e)+'</td><td class="stc">'+badge(c.s)+'</td></tr>';});putH('checks',h+'</tbody>');
  const L=[];CHECKS.forEach(c=>{if(c.s==='warn'||c.s==='bad'){const mo=c.months&&c.months.length?' Mois ou lignes concernés : '+c.months.join(', ')+'.':'';L.push('<li class="'+c.s+'"><b>'+esc(c.name)+'</b> : écart de '+fmt(Math.abs(c.e))+' DT.'+esc(mo)+'</li>');}});
  GROUPS.filter(g=>g.ratio&&RES[g.id]).forEach(g=>{const mm=RES[g.id].rows.map((x,i)=>x.rf?MONTHS[i]:null).filter(Boolean);if(mm.length)L.push('<li class="bad"><b>Taux implicite hors plage — '+esc(g.t)+'</b> en '+mm.join(', ')+' : vérifiez le CA comptable et le classement entre taux.</li>');});
  if(!L.length&&tot)L.push('<li class="good">Aucun écart au-delà de la tolérance de '+fmt(P.tol)+' DT sur les contrôles renseignés.</li>');if(!tot)L.push('<li class="good" style="color:var(--mute)">En attente de données.</li>');putH('alerts',L.join(''));
}

/* ================= Rendu ================= */
const TABS=[['syn','Synthèse'],['tva','TVA'],['rs','Retenues à la source'],['paie','Paie & CNSS'],['is','IS & résultat fiscal'],['par','Paramètres']];
const inp=(path,cls)=>'<input class="'+(cls||'num')+'" inputmode="decimal" data-p="'+path+'" value="'+esc(cls==='plain'?pv(getP(path)):fmtIn(getP(path)))+'">';

function groupHTML(g){
  const cols=['Mois',g.la,g.lb,'Écart'];if(g.th)cols.push(g.thl,'Écart théorique');if(g.ratio)cols.push('Taux implicite');cols.push('Statut');
  let h=(g.sec?'<h2 class="sec">'+esc(g.sec)+'</h2>':'')+'<div class="card"><h3>'+esc(g.t)+'</h3>'+ (g.src?'<p class="hint">'+esc(g.src)+'</p>':'')+'<div class="scroll"><table class="grid"><thead><tr>'+cols.map((c,i)=>'<th'+(i===cols.length-1?' class="stc"':'')+'>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>';
  for(let i=0;i<12;i++){h+='<tr><td class="m">'+MONTHS[i]+'</td>'+ (g.sumA?'<td class="r" id="o-'+g.id+'-a-'+i+'"></td><td class="r" id="o-'+g.id+'-b-'+i+'"></td>':'<td>'+inp(g.a+'.'+i)+'</td><td>'+inp(g.b+'.'+i)+'</td>')+'<td class="r" id="o-'+g.id+'-e-'+i+'"></td>'+ (g.th?'<td class="r" id="o-'+g.id+'-th-'+i+'"></td><td class="r" id="o-'+g.id+'-eth-'+i+'"></td>':'')+ (g.ratio?'<td class="r" id="o-'+g.id+'-r-'+i+'"></td>':'')+'<td class="stc" id="o-'+g.id+'-s-'+i+'"></td></tr>';}
  h+='</tbody><tfoot><tr><td>Total</td><td class="r" id="o-'+g.id+'-a-T"></td><td class="r" id="o-'+g.id+'-b-T"></td><td class="r" id="o-'+g.id+'-e-T"></td>'+ (g.th?'<td class="r" id="o-'+g.id+'-th-T"></td><td class="r" id="o-'+g.id+'-eth-T"></td>':'')+(g.ratio?'<td class="r" id="o-'+g.id+'-r-T"></td>':'')+'<td class="stc" id="o-'+g.id+'-s-T"></td></tr></tfoot></table></div></div>';return h;
}

function panSyn(){return '<p class="intro">Vue d’ensemble des recoupements. Chaque contrôle compare la comptabilité aux déclarations (ou à un calcul théorique) et signale les écarts au-delà de la tolérance fixée dans les paramètres.</p><div class="kpis" id="kpis"></div><div class="card"><div class="cardhead"><h3>Tableau des contrôles</h3><div><button data-act="csv">Exporter en CSV</button></div></div><div class="scroll"><table class="grid" id="checks"></table></div></div><div class="card"><h3>Points d’attention</h3><ul class="alerts" id="alerts"></ul></div>';}
function panTVA(){return '<p class="intro">Recoupement mois par mois entre la comptabilité et les déclarations de TVA.</p>'+GROUPS.filter(g=>g.mod==='TVA').map(groupHTML).join('');}
function rsRowHTML(r,i){return '<tr><td><select data-p="rs.'+i+'.mois" aria-label="Mois">'+MONTHS.map((m,k)=>'<option value="'+k+'"'+(+r.mois===k?' selected':'')+'>'+m.slice(0,4)+'.</option>').join('')+'</select></td><td><input class="txt" data-p="rs.'+i+'.tiers" value="'+esc(r.tiers)+'" placeholder="Bénéficiaire / MF"></td><td><select data-act="nat" data-i="'+i+'" aria-label="Nature">'+P.rsNat.map((n,k)=>'<option value="'+k+'"'+(+r.nature===k?' selected':'')+'>'+esc(n.n)+'</option>').join('')+'</select></td><td>'+inp('rs.'+i+'.assiette')+'</td><td><input class="plain" id="rs-t-'+i+'" data-p="rs.'+i+'.taux" inputmode="decimal" value="'+esc(pv(r.taux))+'"></td><td class="r" id="o-rs-th-'+i+'"></td><td>'+inp('rs.'+i+'.compta')+'</td><td>'+inp('rs.'+i+'.decl')+'</td><td class="r" id="o-rs-e1-'+i+'"></td><td class="r" id="o-rs-e2-'+i+'"></td><td class="stc" id="o-rs-s-'+i+'"></td><td><button class="x" data-act="delRS" data-i="'+i+'" title="Supprimer" aria-label="Supprimer">×</button></td></tr>';}
function panRS(){return '<p class="intro">Contrôle des retenues à la source opérées sur les paiements.</p><div class="card"><div class="cardhead"><h3>Paiements soumis à retenue</h3><div><button class="primary" data-act="addRS">+ Ajouter une ligne</button></div></div><div class="scroll"><table class="grid" style="min-width:1100px"><thead><tr><th>Mois</th><th>Bénéficiaire</th><th>Nature</th><th>Assiette</th><th>Taux %</th><th>RS théorique</th><th>Comptabilisée</th><th>Déclarée</th><th>Écart compta − théo.</th><th>Écart compta − décl.</th><th class="stc">Statut</th><th></th></tr></thead><tbody id="rsBody">'+state.rs.map(rsRowHTML).join('')+'</tbody><tfoot><tr><td colspan="5">Total</td><td class="r" id="o-rs-T-th"></td><td class="r" id="o-rs-T-c"></td><td class="r" id="o-rs-T-d"></td><td class="r" id="o-rs-T-e1"></td><td class="r" id="o-rs-T-e2"></td><td></td><td></td></tr></tfoot></table></div></div>';}
function panPaie(){return '<p class="intro">Recoupement de la paie : salaires comptabilisés et déclarations CNSS.</p>'+GROUPS.filter(g=>g.mod==='Paie'&&!g.duo).map(groupHTML).join('')+'<h2 class="sec">TFP et FOPROLOS</h2><div class="duo">'+GROUPS.filter(g=>g.duo).map(groupHTML).join('')+'</div>';}
function kvIn(path,label,extra){return '<div class="kv"><label>'+label+'</label>'+inp(path)+(extra?'<small>'+extra+'</small>':'')+'</div>';}
function kvOut(id,label,tot){return '<div class="kv'+(tot?' total':'')+'"><span>'+label+'</span><b id="o-'+id+'"></b></div>';}
function listHTML(kind){return state.is[kind].map((r,i)=>'<div class="lrow"><input class="txt" data-p="is.'+kind+'.'+i+'.lib" value="'+esc(r.lib)+'" placeholder="Libellé"><input class="num" inputmode="decimal" data-p="is.'+kind+'.'+i+'.mt" value="'+esc(fmtIn(r.mt))+'"><button class="x" data-act="del" data-k="'+kind+'" data-i="'+i+'" title="Supprimer" aria-label="Supprimer">×</button></div>').join('');}
function panIS(){const s=state.is;return '<p class="intro">Passage du résultat comptable au résultat fiscal.</p><div class="cols"><div class="card"><h3>1. Du résultat comptable au résultat fiscal</h3>'+kvIn('is.rc','Résultat comptable avant impôt')+'<h4>Réintégrations <button data-act="add" data-k="reint">+ Ajouter</button></h4><div id="l-reint">'+listHTML('reint')+'</div>'+kvOut('is-reint','Total réintégrations')+'<h4>Déductions <button data-act="add" data-k="deduc">+ Ajouter</button></h4><div id="l-deduc">'+listHTML('deduc')+'</div>'+kvOut('is-deduc','Total déductions')+kvOut('is-rf','Résultat fiscal avant déficits',true)+kvIn('is.deficit','Déficits antérieurs imputés')+kvOut('is-base','Bénéfice imposable',true)+'</div><div class="card"><h3>2. Liquidation de l’IS</h3><div class="kv"><label>Régime / taux</label><select data-p="is.regime">'+Object.keys(REG).map(k=>'<option value="'+k+'"'+(s.regime===k?' selected':'')+'>'+REG[k].l+'</option>').join('')+'</select></div>'+kvOut('is-th','IS au taux du régime')+kvIn('is.ca','CA retenu pour le minimum d’impôt')+kvOut('is-ca','CA utilisé')+kvOut('is-min','Minimum d’impôt')+kvOut('is-du','IS dû',true)+'<div class="kv chk"><input type="checkbox" id="chkCss" data-p="is.css"'+(s.css?' checked':'')+'><label for="chkCss">CSS exceptionnelle</label></div>'+kvOut('is-css','CSS exceptionnelle')+'<div class="kv chk"><input type="checkbox" id="chkC4" data-p="is.c4"'+(s.c4?' checked':'')+'><label for="chkC4">Contribution de 4 %</label></div>'+kvOut('is-c4','Contribution de 4 %')+kvOut('is-tot','Total impôt et contributions',true)+'<h4>Acomptes</h4>'+kvIn('is.is_n1','IS de l’exercice précédent')+kvIn('is.ac1','Acompte n° 1')+kvIn('is.ac2','Acompte n° 2')+kvIn('is.ac3','Acompte n° 3')+kvOut('is-acexp','Acomptes attendus')+kvOut('is-acv','Acomptes versés')+kvIn('is.rsub','Retenues à la source subies')+kvOut('is-solde','Solde à régler',true)+'</div></div>';}

function panPar(){
  const f=(label,path)=>'<div><label>'+label+'</label>'+inp('P.'+path,'plain')+'</div>';
  return '<p class="intro">Paramètres de calcul et de tolérance.</p><div class="card"><h3>Tolérances</h3><div class="pgrid">'+f('Tolérance d’écart (DT)','tol')+f('TVA réduit (%)','tvaLow')+f('TVA normal (%)','tvaHigh')+f('Tolérance taux implicite (points)','rateTol')+'</div></div><div class="card"><h3>Cotisations et taxes sur salaires</h3><div class="pgrid">'+f('CNSS patronale (%)','cnss.pat')+f('Accidents du travail (%)','cnss.at')+f('CNSS salariale (%)','cnss.sal')+f('TFP (%)','tfp')+f('FOPROLOS (%)','foprolos')+'</div></div><div class="card"><h3>Natures de retenue à la source</h3><div class="scroll"><table class="grid"><thead><tr><th>Nature</th><th>Taux %</th><th>Seuil TTC (DT)</th></tr></thead><tbody>'+P.rsNat.map((n,i)=>'<tr><td>'+esc(n.n)+'</td><td>'+inp('P.rsNat.'+i+'.t','plain')+'</td><td>'+inp('P.rsNat.'+i+'.seuil','plain')+'</td></tr>').join('')+'</tbody></table></div></div><button data-act="resetP">Rétablir les valeurs par défaut</button>';
}

function renderAll(){
  $('#societe').innerHTML=lists.societes.map(s=>'<option'+(s===meta.societe?' selected':'')+'>'+esc(s)+'</option>').join('');$('#exercice').innerHTML=lists.exercices.map(k=>'<option value="'+k+'"'+(k===meta.exercice?' selected':'')+'>Exercice '+k+'</option>').join('');$('#tabs').innerHTML=TABS.map(t=>'<button role="tab" data-tab="'+t[0]+'" aria-selected="'+(t[0]===activeTab)+'">'+t[1]+'</button>').join('');
  const body={syn:panSyn,tva:panTVA,rs:panRS,paie:panPaie,is:panIS,par:panPar};$('#panels').innerHTML=TABS.map(t=>'\x3csection class="panel" id="p-'+t[0]+'"'+(t[0]===activeTab?'':' hidden')+'>'+body[t[0]]()+'</section>').join('');recalc();
}
function recalc(){GROUPS.forEach(g=>{const r=computeGroup(g);RES[g.id]=r;paintGroup(g,r);});computeRS();computeIS();paintSummary();decorate();}
function showTab(t){activeTab=t;document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===t)));document.querySelectorAll('.panel').forEach(p=>p.hidden=(p.id!=='p-'+t));window.scrollTo(0,0);}

/* ================= Événements ================= */
document.addEventListener('input',e=>{const t=e.target;if(!t||!t.dataset)return;if(t.dataset.act==='nat'){const i=+t.dataset.i;state.rs[i].nature=+t.value;state.rs[i].taux=P.rsNat[+t.value].t;const tx=document.getElementById('rs-t-'+i);if(tx)tx.value=pv(state.rs[i].taux);saveAll();recalc();return;}if(!t.dataset.p)return;const path=t.dataset.p;if(path.startsWith('P.')){let v=t.type==='checkbox'?t.checked:(t.value.trim()===''?null:num(t.value));if(typeof v==='string')v=null;if(v==null) v=0;setP(path,v);}else setP(path,t.type==='checkbox'?t.checked:t.value);saveAll();recalc();});
document.addEventListener('focusin',e=>{const t=e.target;if(!t||!t.classList||!t.classList.contains('num')||!t.dataset||!t.dataset.p)return;const raw=getP(t.dataset.p);if(raw!=null&&raw!==''){t.value=String(raw);try{t.select();}catch(x){}}});
document.addEventListener('focusout',e=>{const t=e.target;if(!t||!t.classList||!t.classList.contains('num')||!t.dataset||!t.dataset.p)return;const v=t.value;if(v.trim()!==''&&num(v)==null){t.classList.add('err');t.title='Formule invalide';return;}t.classList.remove('err');t.value=fmtIn(v);decorate();});
function decorate(){document.querySelectorAll('input.num[data-p]').forEach(el=>{if(el.classList.contains('err'))return;const raw=getP(el.dataset.p);if(isFormula(raw)){el.classList.add('hasf');el.title='Formule : '+String(raw)+' = '+fmt(num(raw));}else{el.classList.remove('hasf');el.removeAttribute('title');}});}
$('#societe').addEventListener('change',e=>switchTo(e.target.value,null));$('#exercice').addEventListener('change',e=>switchTo(null,e.target.value));
function addSoc(){const v=(window.prompt('Nom de la nouvelle société :')||'').trim().toUpperCase();if(!v)return;if(lists.societes.some(s=>s.toUpperCase()===v)){alert('Cette société existe déjà.');return;}lists.societes.push(v);switchTo(v,null);}
function addEx(){const v=parseInt((window.prompt('Année du nouvel exercice :')||'').trim(),10);if(!v)return;if(v<2000||v>2100){alert('Année invalide.');return;}lists.exercices.push(v);lists.exercices.sort((a,b)=>a-b);switchTo(null,v);}
function switchTo(soc,ex){saveAll();if(soc!=null)meta.societe=soc;if(ex!=null)meta.exercice=+ex;loadDossier();saveAll();renderAll();}

/* ================= Thème ================= */
const PAL={teal:{n:'Turquoise',l:['#0e4a5a','#0b3744','#145c6e'],d:['#4fb3c9','#0b3744','#145c6e']},navy:{n:'Bleu marine',l:['#1f3f94','#14285a','#24449e'],d:['#7ea6ff','#14285a','#24449e']},green:{n:'Vert',l:['#1d6b4a','#12432e','#1d7a53'],d:['#5ccb97','#12432e','#1d7a53']},burgundy:{n:'Bordeaux',l:['#8b2635','#5c1522','#a02d3f'],d:['#ec8393','#5c1522','#a02d3f']},violet:{n:'Violet',l:['#5b3fa0','#3a2670','#6c4bbd'],d:['#b8a2ff','#3a2670','#6c4bbd']},slate:{n:'Ardoise',l:['#3d4b57','#222c34','#4a5a68'],d:['#a5b8c7','#222c34','#4a5a68']},ochre:{n:'Ocre',l:['#a85a05','#6e3b04','#bf6a0a'],d:['#f2ac57','#6e3b04','#bf6a0a']}};
let theme={color:'teal',mode:'auto'};try{const t=JSON.parse(localStorage.getItem('rcf:theme')||'null');if(t&&PAL[t.color])theme=Object.assign(theme,t);}catch(e){}
const mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
function applyTheme(){const dark=theme.mode==='dark'||(theme.mode==='auto'&&mq&&mq.matches);const c=(PAL[theme.color]||PAL.teal)[dark?'d':'l'],r=document.documentElement;r.dataset.mode=theme.mode;r.style.setProperty('--brand',c[0]);r.style.setProperty('--on-brand',dark?'#08222a':'#ffffff');r.style.setProperty('--hdr',c[1]);r.style.setProperty('--hdr2',c[2]);}
function renderThemeBox(){$('#themeBox').innerHTML='<div class="thl">Couleur</div><div class="sws">'+Object.keys(PAL).map(k=>'<button class="sw" data-act="color" data-k="'+k+'" aria-pressed="'+(theme.color===k)+'" title="'+PAL[k].n+'" style="background:'+PAL[k].l[0]+'"></button>').join('')+'</div><div class="thl">Affichage</div><div class="modes">'+[['auto','Auto'],['light','Clair'],['dark','Sombre']].map(m=>'<button data-act="mode" data-k="'+m[0]+'" aria-pressed="'+(theme.mode===m[0])+'">'+m[1]+'</button>').join('')+'</div>';}
function saveTheme(){try{localStorage.setItem('rcf:theme',JSON.stringify(theme));}catch(e){}applyTheme();renderThemeBox();}if(mq&&mq.addEventListener)mq.addEventListener('change',applyTheme);applyTheme();renderThemeBox();

document.addEventListener('click',e=>{if(!e.target.closest('.tw'))$('#themeBox').hidden=true;const tb=e.target.closest('[data-tab]');if(tb){showTab(tb.dataset.tab);return;}const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;const a=b.dataset.act,i=+b.dataset.i,k=b.dataset.k;if(a==='theme'){$('#themeBox').hidden=!$('#themeBox').hidden;}else if(a==='color'){theme.color=k;saveTheme();}else if(a==='mode'){theme.mode=k;saveTheme();}else if(a==='addSoc')addSoc();else if(a==='addEx')addEx();else if(a==='lock')doLock();else if(a==='print')window.print();else if(a==='export')exportJSON();else if(a==='import')$('#file').click();else if(a==='csv')exportCSV();else if(a==='addRS'){state.rs.push({mois:'0',tiers:'',nature:0,assiette:'',taux:P.rsNat[0].t,compta:'',decl:''});$('#rsBody').innerHTML=state.rs.map(rsRowHTML).join('');saveAll();recalc();}else if(a==='delRS'){state.rs.splice(i,1);$('#rsBody').innerHTML=state.rs.map(rsRowHTML).join('');saveAll();recalc();}else if(a==='add'){state.is[k].push({lib:'',mt:''});$('#l-'+k).innerHTML=listHTML(k);saveAll();recalc();}else if(a==='del'){state.is[k].splice(i,1);if(!state.is[k].length)state.is[k].push({lib:'',mt:''});$('#l-'+k).innerHTML=listHTML(k);saveAll();recalc();}else if(a==='resetP'){if(confirm('Rétablir tous les paramètres par défaut ?')){P=JSON.parse(JSON.stringify(DEF_PARAMS));saveAll();renderAll();}}});

function download(name,mime,content){const bl=new Blob([content],{type:mime}),u=URL.createObjectURL(bl),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);}const slug=()=>((meta.societe||'dossier').replace(/[^\w\-]+/g,'_'))+'_'+meta.exercice;
function exportJSON(){download('recoupement_'+slug()+'.json','application/json',JSON.stringify({meta,state,params:P},null,2));}
function exportCSV(){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',n=v=>v==null?'':String(Math.round(v*1000)/1000).replace('.',','),rows=[['Domaine','Contrôle','Valeur A','Valeur B','Écart','Statut']];CHECKS.forEach(c=>rows.push([c.mod,c.name,n(c.A),n(c.B),n(c.e),LAB[c.s]]));download('controles_'+slug()+'.csv','text/csv;charset=utf-8','\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n'));}
$('#file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.meta)meta=Object.assign(meta,d.meta);if(d.params)P=merge(DEF_PARAMS,d.params);ensureLists();state=merge(blank(),d.state||{});saveAll();renderAll();}catch(err){alert('Fichier illisible : '+err.message);}};r.readAsText(f);e.target.value='';});

/* ================= Verrouillage ================= */
let fails=0,until=0,idle=null,booted=false;
function msg(t){$('#lockMsg').textContent=t;}
function unlock(){try{sessionStorage.setItem('rcf_s',H_FAST);}catch(e){}$('#lock').hidden=true;$('#app').hidden=false;if(!booted){loadAll();booted=true;}renderAll();armIdle();}
function doLock(){try{sessionStorage.removeItem('rcf_s');}catch(e){}saveAll();$('#panels').innerHTML='';$('#tabs').innerHTML='';$('#app').hidden=true;$('#lock').hidden=false;$('#pwd').value='';msg('');clearTimeout(idle);}
function armIdle(){clearTimeout(idle);idle=setTimeout(()=>{if(!$('#app').hidden)doLock();},15*60*1000);}['mousemove','keydown','click','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{if(!$('#app').hidden)armIdle();},{passive:true}));
$('#lockForm').addEventListener('submit',async ev=>{ev.preventDefault();const now=Date.now();if(now<until){msg('Trop de tentatives. Réessayez dans '+Math.ceil((until-now)/1000)+' s.');return;}const ok=await checkPwd($('#pwd').value);if(ok){fails=0;msg('');unlock();}else{fails++;$('#pwd').value='';if(fails>=5){fails=0;until=Date.now()+30000;msg('Trop de tentatives. Patientez 30 secondes.');}else msg('Mot de passe incorrect.');}});
try{if(sessionStorage.getItem('rcf_s')===H_FAST)unlock();}catch(e){}
})();
</script>
</body>
</html>
