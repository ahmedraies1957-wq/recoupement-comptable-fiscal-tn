<!DOCTYPE html>
<html lang="fr" data-mode="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recoupement comptable et fiscal — Tunisie</title>
<style>
:root{--bg:#f4f2ec;--card:#ffffff;--ink:#1c2a33;--mute:#667781;--line:#ded9cc;--field:#fbfaf6;--brand:#0e4a5a;--on-brand:#ffffff;--ok:#1d7a4c;--okbg:#e3f3ea;--warn:#9a5700;--warnbg:#fdf0d9;--bad:#b3261e;--badbg:#fbe4e1;--radius:10px;--shadow:0 1px 2px rgba(20,40,50,.06),0 4px 14px rgba(20,40,50,.05)}
html[data-mode=dark]{--bg:#10181d;--card:#172229;--ink:#e6ecef;--mute:#92a3ac;--line:#2a3a43;--field:#122027;--ok:#5fd39a;--okbg:#14352a;--warn:#f0b35a;--warnbg:#3a2c12;--bad:#ff8a80;--badbg:#3c1b19;--shadow:none}
@media (prefers-color-scheme:dark){html[data-mode=auto]{--bg:#10181d;--card:#172229;--ink:#e6ecef;--mute:#92a3ac;--line:#2a3a43;--field:#122027;--ok:#5fd39a;--okbg:#14352a;--warn:#f0b35a;--warnbg:#3a2c12;--bad:#ff8a80;--badbg:#3c1b19;--shadow:none}}
:root{--hdr:#0b3744;--hdr2:#145c6e}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}[hidden]{display:none!important}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px}button:hover{border-color:var(--brand)}button.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand);font-weight:600}button.x{padding:2px 8px;color:var(--bad);border-color:transparent;background:transparent;font-size:18px}input,select{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
#lock{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,var(--hdr),var(--hdr2))}.lockcard{width:min(420px,100%);background:var(--card);border-radius:14px;padding:32px 28px}.lockcard h1{font-size:20px;margin:0 0 4px}.lockcard p{margin:0 0 18px;color:var(--mute)}.lockcard input{width:100%;padding:11px}.lockcard button{width:100%;margin-top:12px;padding:11px}
header.top{background:var(--hdr);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}header.top h1{margin:0;font-size:17px}header.top h1 small{display:block;font-weight:400;opacity:.7;font-size:12px}.ctl{display:flex;flex-wrap:wrap;gap:8px}.ctl input,.ctl select{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}.ctl button{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:10px 20px;border-bottom:1px solid var(--line)}nav.tabs button{white-space:nowrap;border-radius:999px;padding:7px 16px}nav.tabs button[aria-selected=true]{background:var(--brand);color:var(--on-brand)}main{max-width:1240px;margin:auto;padding:18px 20px 60px}.intro{color:var(--mute);max-width:80ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow)}.card h3{margin:0 0 4px}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}.kpi span{display:block;color:var(--mute);font-size:12px}.kpi b{font-size:26px}
.scroll{overflow-x:auto}table.grid{border-collapse:collapse;width:100%;min-width:640px}.grid th{font-size:11.5px;color:var(--mute);text-align:right;padding:8px;border-bottom:2px solid var(--line)}.grid th:first-child,.grid td:first-child{text-align:left}.grid td{padding:4px;border-bottom:1px solid var(--line)}.grid td.r{text-align:right}.grid input{width:100%;border-color:transparent;background:transparent;text-align:right}.grid tfoot td{font-weight:700;border-top:2px solid var(--line)}
.b{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px}.b.ok{background:var(--okbg);color:var(--ok)}.b.warn{background:var(--warnbg);color:var(--warn)}.b.bad{background:var(--badbg);color:var(--bad)}
.kv{display:grid;grid-template-columns:1fr 190px;gap:10px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line)}.kv input,.kv select{width:100%;text-align:right}.kv b{text-align:right}.kv.total{border-bottom:2px solid var(--line);font-weight:700}.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.hint,.warnbox{color:var(--mute);font-size:13px}.warnbox{background:var(--warnbg);padding:10px;border-radius:8px}@media(max-width:640px){main{padding:14px 12px}.cols{grid-template-columns:1fr}}
@media print{header.top .ctl,nav.tabs,button{display:none!important}body{background:#fff;color:#000}.card,.kpi{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<div id="lock"><form class="lockcard" id="lockForm"><h1>Recoupement comptable et fiscal</h1><p>Accès protégé.</p><input type="password" id="pwd" placeholder="Mot de passe" autofocus><button class="primary" type="submit">Déverrouiller</button><div id="lockMsg"></div></form></div>
<div id="app" hidden><header class="top"><h1>Recoupement comptable et fiscal<small>Tunisie · montants en dinars (DT)</small></h1><div class="ctl"><select id="societe"></select><button data-act="addSoc">+ Société</button><select id="exercice"></select><button data-act="addEx">+ Exercice</button><button data-act="export">Exporter</button><button data-act="import">Importer</button><input type="file" id="file" accept="application/json" hidden><button data-act="print">Imprimer</button><button data-act="lock">Verrouiller</button></div></header><nav class="tabs" id="tabs"></nav><main id="panels"></main></div>
<script>
(function(){"use strict";
const $=s=>document.querySelector(s);
const MONTHS=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const SALT="RCF-TN|",H_SHA="ebd4040b13601074db6f6c3123a854133e8c0507b0746c6b220a26330b1094ee",H_FAST="2817454156479759";
function cyrb53(str,seed){seed=seed||0;let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)}
async function checkPwd(p){const s=SALT+p;try{if(window.crypto&&crypto.subtle){const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));const h=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");return h===H_SHA}}catch(e){}return String(cyrb53(s))===H_FAST}
const norm=v=>String(v).replace(/[\s  ]/g,"").replace(/−/g,"-").replace(/,/g,".");
function num(v){if(v===""||v==null)return null;if(typeof v==="number")return isFinite(v)?v:null;const s=norm(v);if(!s)return null;if(!/^[+-]?(\d+\.?\d*|\.\d+)$/.test(s))return null;const n=parseFloat(s);return isFinite(n)?n:null}
const z=v=>num(v)||0,nf=new Intl.NumberFormat("fr-FR",{minimumFractionDigits:3,maximumFractionDigits:3}),fmt=n=>n==null?"":nf.format(Math.round(n*1000)/1000),fmtIn=v=>{const n=num(v);return n==null?"":nf.format(n)},esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c])),arr=()=>Array(12).fill("");
const DEF={tol:1,tvaLow:7,tvaHigh:19,pat:16.57,at:0.5,sal:9.18,tfp:1,fop:1};let P={...DEF};
function blank(){return{tva:{ca7_c:arr(),ca7_d:arr(),ca19_c:arr(),ca19_d:arr(),exp_c:arr(),exp_d:arr(),col7_c:arr(),col7_d:arr(),col19_c:arr(),col19_d:arr(),dedI_c:arr(),dedI_d:arr(),dedL_c:arr(),dedL_d:arr()},paie:{brut_c:arr(),ass_d:arr(),pat_c:arr(),pat_d:arr(),sal_c:arr(),sal_d:arr(),irpp_c:arr(),irpp_d:arr(),tfp_c:arr(),tfp_d:arr(),fop_c:arr(),fop_d:arr()},is:{rc:"",deficit:"",regime:"20",css:true,c4:false,ca:"",is_c:"",cs_c:""},rs:[]}}
let state=blank(),meta={societe:"PROMOSCIENCES",exercice:new Date().getFullYear()},lists={societes:["PROMOSCIENCES","NORAFRIMED","TUNLYB TEKLAB","TECHNOLABO","NORAFRILABS","LSTE","LIFE SCIENCES AND TESTING EQUIPMENT","TECHNOLABO INTERNATIONALE"],exercices:[2024,2025,2026,2027,2028,2029,2030]},active="syn";
const REG={"20":"Taux normal 20 %","10":"Taux réduit 10 %","35":"Taux majoré 35 %","40":"Taux majoré 40 %","0":"Exonérée / déduction totale"};
function ls(fn){try{return fn()}catch(e){return null}}function dkey(){return"rcf:d:"+meta.societe+":"+meta.exercice}function save(){ls(()=>{localStorage.setItem(dkey(),JSON.stringify(state));localStorage.setItem("rcf:meta",JSON.stringify(meta));localStorage.setItem("rcf:params",JSON.stringify(P))})}function load(){const m=ls(()=>JSON.parse(localStorage.getItem("rcf:meta")||"null"));if(m)meta={...meta,...m};const p=ls(()=>JSON.parse(localStorage.getItem("rcf:params")||"null"));if(p)P={...DEF,...p};const s=ls(()=>JSON.parse(localStorage.getItem(dkey())||"null"));state=s||blank()}
function getP(p){return p.split(".").reduce((o,k)=>o&&o[k],{...state,P:P})}
function setP(p,v){const a=p.split("."),q=a.pop(),o=a.reduce((o,k)=>o[k],p.startsWith("P.")?P:state);o[q]=v}
const TABS=[["syn","Synthèse"],["tva","TVA"],["paie","Paie & CNSS"],["rs","Retenues à la source"],["is","IS & résultat fiscal"],["par","Paramètres"]];
const sumA=(paths)=>paths.reduce((t,p)=>t+P,0);
function inp(path){return'<input class="num" inputmode="decimal" data-p="'+path+'" value="'+esc(fmtIn(getP(path)))+'">'}
function tableMonth(title,a,b){let h='<div class="card"><h3>'+title+'</h3><div class="scroll"><table class="grid"><thead><tr><th>Mois</th><th>Comptabilité</th><th>Déclaré</th><th>Écart</th></tr></thead><tbody>';for(let i=0;i<12;i++){const av=num(getP(a+'.'+i)),bv=num(getP(b+'.'+i)),e=av==null&&bv==null?null:(av||0)-(bv||0);h+='<tr><td>'+MONTHS[i]+'</td><td>'+inp(a+'.'+i)+'</td><td>'+inp(b+'.'+i)+'</td><td class="r">'+fmt(e)+'</td></tr>'}h+='</tbody></table></div></div>';return h}
function syn(){let c=[],e=[];[["CA 7 %","tva.ca7_c","tva.ca7_d"],["CA 19 %","tva.ca19_c","tva.ca19_d"],["TVA collectée 7 %","tva.col7_c","tva.col7_d"],["TVA collectée 19 %","tva.col19_c","tva.col19_d"],["TVA déductible import","tva.dedI_c","tva.dedI_d"],["TVA déductible local","tva.dedL_c","tva.dedL_d"],["Salaires bruts","paie.brut_c","paie.ass_d"]].forEach(x=>{let a=0,b=0,ok=true;for(let i=0;i<12;i++){const av=z(getP(x[1]+'.'+i)),bv=z(getP(x[2]+'.'+i));a+=av;b+=bv;if(Math.abs(av-bv)>P.tol)ok=false}c.push({n:x[0],a,b,e:a-b,ok});});let h='<p class="intro">Vue d’ensemble des recoupements comptables et fiscaux.</p><div class="kpis"><div class="kpi"><span>Contrôles</span><b>'+c.length+'</b></div><div class="kpi"><span>Conformes</span><b>'+c.filter(x=>x.ok).length+'</b></div><div class="kpi"><span>À vérifier</span><b>'+c.filter(x=>!x.ok).length+'</b></div></div><div class="card"><div class="scroll"><table class="grid"><thead><tr><th>Contrôle</th><th>Comptabilité</th><th>Déclaré</th><th>Écart</th><th>Statut</th></tr></thead><tbody>';c.forEach(x=>h+='<tr><td>'+x.n+'</td><td class="r">'+fmt(x.a)+'</td><td class="r">'+fmt(x.b)+'</td><td class="r">'+fmt(x.e)+'</td><td>'+('<span class="b '+(x.ok?'ok':'warn')+'">'+(x.ok?'Conforme':'À justifier')+'</span>')+'</td></tr>');h+='</tbody></table></div></div>';return h}
function tva(){return tableMonth("Chiffre d’affaires HT — taux 7 %","tva.ca7_c","tva.ca7_d")+tableMonth("Chiffre d’affaires HT — taux 19 %","tva.ca19_c","tva.ca19_d")+tableMonth("Exportations","tva.exp_c","tva.exp_d")+tableMonth("TVA collectée — 7 %","tva.col7_c","tva.col7_d")+tableMonth("TVA collectée — 19 %","tva.col19_c","tva.col19_d")+tableMonth("TVA déductible — importations","tva.dedI_c","tva.dedI_d")+tableMonth("TVA déductible — marché local","tva.dedL_c","tva.dedL_d")}
function paie(){return tableMonth("Salaires bruts","paie.brut_c","paie.ass_d")+tableMonth("Cotisations patronales CNSS","paie.pat_c","paie.pat_d")+tableMonth("Cotisations salariales CNSS","paie.sal_c","paie.sal_d")+tableMonth("IRPP retenu","paie.irpp_c","paie.irpp_d")+tableMonth("TFP","paie.tfp_c","paie.tfp_d")+tableMonth("FOPROLOS","paie.fop_c","paie.fop_d")}
function rs(){let h='<div class="card"><div class="pgrid"><button class="primary" data-act="addRS">+ Ajouter une retenue</button></div><div class="scroll"><table class="grid"><thead><tr><th>Mois</th><th>Bénéficiaire</th><th>Taux %</th><th>Assiette</th><th>Comptabilisé</th><th>Déclaré</th><th></th></tr></thead><tbody>';state.rs.forEach((r,i)=>h+='<tr><td><select data-p="rs.'+i+'.mois">'+MONTHS.map((m,k)=>'<option value="'+k+'" '+(r.mois==k?'selected':'')+'>'+m+'</option>').join("")+'</select></td><td><input data-p="rs.'+i+'.tiers" value="'+esc(r.tiers||"")+'"></td><td><input data-p="rs.'+i+'.taux" value="'+esc(r.taux||"")+'"></td><td>'+inp('rs.'+i+'.assiette')+'</td><td>'+inp('rs.'+i+'.compta')+'</td><td>'+inp('rs.'+i+'.decl')+'</td><td><button class="x" data-act="delRS" data-i="'+i+'">×</button></td></tr>');h+='</tbody></table></div></div>';return h}
function isP(){const s=state.is;return'<div class="cols"><div class="card"><h3>Résultat fiscal</h3><div class="kv"><label>Résultat comptable</label>'+inp('is.rc')+'</div><div class="kv"><label>Déficits imputés</label>'+inp('is.deficit')+'</div><div class="kv"><label>Régime</label><select data-p="is.regime">'+Object.keys(REG).map(k=>'<option value="'+k+'" '+(s.regime===k?'selected':'')+'>'+REG[k]+'</option>').join("")+'</select></div><div class="kv"><label>CA retenu</label>'+inp('is.ca')+'</div></div><div class="card"><h3>Liquidation</h3><div class="kv"><span>Bénéfice imposable</span><b id="isBase"></b></div><div class="kv"><span>IS dû</span><b id="isDue"></b></div><div class="kv"><label>Charge comptabilisée</label>'+inp('is.is_c')+'</div><div class="kv"><span>Écart</span><b id="isGap"></b></div></div></div>'}
function par(){const f=(l,k)=>'<div><label>'+l+'</label>'+inp('P.'+k)+'</div>';return'<div class="card"><h3>Paramètres</h3><div class="pgrid">'+f("Tolérance DT","tol")+f("TVA réduit %","tvaLow")+f("TVA normal %","tvaHigh")+f("CNSS patronale %","pat")+f("Accidents travail %","at")+f("CNSS salariale %","sal")+f("TFP %","tfp")+f("FOPROLOS %","fop")+'</div><p><button data-act="resetP">Rétablir les valeurs par défaut</button></p></div>'}
function render(){$("#societe").innerHTML=lists.societes.map(s=>'<option '+(s===meta.societe?'selected':'')+'>'+esc(s)+'</option>').join("");$("#exercice").innerHTML=lists.exercices.map(k=>'<option value="'+k+'" '+(k===meta.exercice?'selected':'')+'>Exercice '+k+'</option>').join("");$("#tabs").innerHTML=TABS.map(t=>'<button data-tab="'+t[0]+'" aria-selected="'+(t[0]===active)+'">'+t[1]+'</button>').join("");const body={syn:syn,tva:tva,paie:paie,rs:rs,is:isP,par:par};$("#panels").innerHTML=TABS.map(t=>'<section class="panel" id="p-'+t[0]+'" '+(t[0]===active?'':'hidden')+'>'+body[t[0]]()+'</section>').join("");recalc()}
function recalc(){if($("isBase")){const rc=z(state.is.rc),def=z(state.is.deficit),base=Math.max(0,rc-def),rate=+state.is.regime||20,ca=z(state.is.ca),isDue=Math.max(base*rate/100,ca*.002);$("isBase").textContent=fmt(base);$("isDue").textContent=fmt(isDue);$("isGap").textContent=fmt(z(state.is.is_c)-isDue)}}
function showTab(t){active=t;document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===t)));document.querySelectorAll(".panel").forEach(p=>p.hidden=p.id!=="p-"+t)}
document.addEventListener("click",e=>{const tb=e.target.closest("[data-tab]");if(tb)return showTab(tb.dataset.tab);const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;if(a==="lock")lock();if(a==="print")window.print();if(a==="export")exportJSON();if(a==="import")$("#file").click();if(a==="addSoc"){const v=prompt("Nom de la société")?.trim().toUpperCase();if(v&&!lists.societes.includes(v)){lists.societes.push(v);meta.societe=v;save();render()}}if(a==="addEx"){const v=parseInt(prompt("Année"),10);if(v&&v>=2000&&v<=2100&&!lists.exercices.includes(v)){lists.exercices.push(v);meta.exercice=v;save();render()}}if(a==="addRS"){state.rs.push({mois:"0",tiers:"",taux:"",assiette:"",compta:"",decl:""});save();render()}if(a==="delRS"){state.rs.splice(+b.dataset.i,1);save();render()}if(a==="resetP"){P={...DEF};save();render()}});
document.addEventListener("input",e=>{const t=e.target;if(!t.dataset.p)return;const p=t.dataset.p;if(p.startsWith("P.")){const k=p.slice(2);P[k]=num(t.value);if(k in DEF){P[k]=num(t.value)||0}}else{setP(p,t.value)}save();recalc()});
$("#societe").addEventListener("change",e=>{meta.societe=e.target.value;load();render()});$("#exercice").addEventListener("change",e=>{meta.exercice=+e.target.value;load();render()});
function exportJSON(){const blob=new Blob([JSON.stringify({meta,state,params:P},null,2)],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="recoupement_"+meta.societe+"_"+meta.exercice+".json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$("#file").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader;r.onload=()=>{try{const d=JSON.parse(r.result);meta=d.meta||meta;state=d.state||state;P={...DEF,...(d.params||{})};save();render()}catch(err){alert("Fichier illisible")}};r.readAsText(f)});
let fails=0,until=0,booted=false;function unlock(){sessionStorage.setItem("rcf_s",H_FAST);$("#lock").hidden=true;$("#app").hidden=false;if(!booted){load();booted=true}render()}function lock(){sessionStorage.removeItem("rcf_s");save();$("#app").hidden=true;$("#lock").hidden=false;$("#pwd").value=""}$("#lockForm").addEventListener("submit",async e=>{e.preventDefault();if(Date.now()<until)return $("#lockMsg").textContent="Patientez avant une nouvelle tentative.";if(await checkPwd($("#pwd").value)){fails=0;unlock()}else{fails++;$("#pwd").value="";if(fails>=5){fails=0;until=Date.now()+30000}$("#lockMsg").textContent="Mot de passe incorrect."}});try{if(sessionStorage.getItem("rcf_s")===H_FAST)unlock()}catch(e){}
})();
</script>
</body>
